services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: always
volumes:
  mongodb_data: